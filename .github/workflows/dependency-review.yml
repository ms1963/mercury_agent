name: Dependency Review

# On every pull request, inspect added or changed dependencies and fail the
# check if any introduce a known vulnerability or a disallowed license. This is
# a GitHub-native action and needs no external services or secrets.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: review dependency changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
