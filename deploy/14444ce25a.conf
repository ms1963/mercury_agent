# Public URL: https://14444ce25a.abacusai.cloud  ->  server_name 14444ce25a.vm.internal
# Mercury Agent reverse proxy (HTTP API + web UI, WebSocket-capable)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name 14444ce25a.vm.internal;

    # Caching is controlled by the app: /api, /metrics and webhook responses are
    # sent with "Cache-Control: no-store". A blanket shared-cache directive here
    # (the former "s-maxage=60") could let an edge cache serve one user's
    # authenticated JSON to another user, so none is added.

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_x_original_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
