services:
  mercury:
    build: .
    image: mercury-agent:latest
    restart: unless-stopped
    ports:
      # Bound to loopback; put a TLS reverse proxy in front for remote access.
      - "127.0.0.1:3000:3000"
    environment:
      # Provider keys. Without any key Mercury has no model; set MERCURY_ENABLE_MOCK=1 for the offline mock provider.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - mercury-data:/data

  # Voice-enabled image (offline whisper/piper baked in). Opt-in:
  #   docker compose --profile voice up -d --build mercury-voice
  mercury-voice:
    profiles: ["voice"]
    build:
      context: .
      dockerfile: Dockerfile.voice
    image: mercury-agent:voice
    restart: unless-stopped
    ports:
      # Bound to loopback; put a TLS reverse proxy in front for remote access.
      - "127.0.0.1:3000:3000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - mercury-data:/data

volumes:
  mercury-data:
